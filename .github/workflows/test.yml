name: Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install packages
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm run type-check
    - name: Test
      run: pnpm run test --testPathIgnorePatterns 'MinecraftServer'
    - name: Build
      run: pnpm run build

  generate-version-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
    - name: Generate version matrix
      id: generate
      run: |
        manifest=$(curl -s https://launchermeta.mojang.com/mc/game/version_manifest.json)
        
        matrix='{"include":['
        for i in {0..4}; do
          url=$(echo "$manifest" | jq -r "[.versions[] | select(.type == \"release\") | .url][$i]")
          version=$(echo "$manifest" | jq -r "[.versions[] | select(.type == \"release\") | .id][$i]")
          java_version=$(curl -s "$url" | jq -r '.javaVersion.majorVersion')
          
          matrix+="{\"javaVersion\":$java_version,\"mcVersion\":\"$version\"}"
          [ $i -lt 4 ] && matrix+=","
        done
        matrix+=']}'
        
        echo "matrix=$matrix" >> $GITHUB_OUTPUT

  server:
    runs-on: ubuntu-latest
    needs: [test, generate-version-matrix]
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
        java-package: jre
    - name: Install packages
      run: pnpm install --frozen-lockfile
    - name: Test
      run: pnpm run test -t 'MinecraftServer'
      env:
        MC_VERSION: ${{ matrix.mcVersion }}
