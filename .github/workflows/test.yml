name: Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install packages
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm run type-check
    - name: Test
      run: pnpm run test --testPathIgnorePatterns 'MinecraftServer'
    - name: Build
      run: pnpm run build

  server:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    strategy:
      matrix:
        include:
        # - javaVersion: 17
        #   mcVersion: '1.18.2'
        - javaVersion: 17
          mcVersion: '1.19.2'
        - javaVersion: 22
          mcVersion: '1.21.5'
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
        java-package: jre
    - name: Install packages
      run: pnpm install --frozen-lockfile
    - name: Test
      run: pnpm run test -t 'MinecraftServer'
      env:
        MC_VERSION: ${{ matrix.mcVersion }}
