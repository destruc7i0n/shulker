name: Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Install packages
      run: yarn install --frozen-lockfile
    - name: Type check
      run: yarn type-check
    - name: Test
      run: yarn test --testPathIgnorePatterns 'MinecraftServer'
    - name: Build
      run: yarn build

  generate-version-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Install packages
      run: yarn install --frozen-lockfile
    - name: Generate version matrix
      id: generate
      run: |
        node -e "
        const { testedVersions } = require('./node_modules/mineflayer/lib/version');
        
        function compareVersions(a, b) {
          const aTuple = a.split('.').map(Number);
          const bTuple = b.split('.').map(Number);
          for (let i = 0; i < Math.max(aTuple.length, bTuple.length); i++) {
            const aVal = aTuple[i] || 0;
            const bVal = bTuple[i] || 0;
            if (aVal < bVal) return -1;
            if (aVal > bVal) return 1;
          }
          return 0;
        }
        
        const versionsToTest = testedVersions.slice(-10);
        
        const matrixItems = versionsToTest.map(mcVersion => ({
          javaVersion: 21, // assume java 21 is supported
          mcVersion
        }));
        
        matrixItems.sort((a, b) => -compareVersions(a.mcVersion, b.mcVersion));
        
        const matrix = { include: matrixItems };
        console.log('matrix=' + JSON.stringify(matrix));
        " >> $GITHUB_OUTPUT

  server:
    runs-on: ubuntu-latest
    needs: [test, generate-version-matrix]
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
        java-package: jdk
    - name: Install packages
      run: yarn install --frozen-lockfile
    - name: Test
      run: yarn test -t 'MinecraftServer'
      env:
        MC_VERSION: ${{ matrix.mcVersion }}
