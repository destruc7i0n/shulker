name: Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install packages
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm run type-check
    - name: Test
      run: pnpm run test --testPathIgnorePatterns 'MinecraftServer'
    - name: Build
      run: pnpm run build

  generate-version-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
    - name: Generate version matrix
      id: generate
      run: |
        python3 -c "
        import json, urllib.request
        from collections import defaultdict
        
        # Fetch manifest
        with urllib.request.urlopen('https://launchermeta.mojang.com/mc/game/version_manifest.json') as f:
          manifest = json.load(f)
        
        # Group releases by major version
        major_versions = defaultdict(list)
        for version in manifest['versions']:
          if version['type'] == 'release':
            major = '.'.join(version['id'].split('.')[:2])  # e.g., '1.21' from '1.21.5'
            major_versions[major].append(version)
        
        matrix_items = []
        for major in sorted(major_versions.keys(), reverse=True)[:5]:
          latest = major_versions[major][0]  # First is latest
          
          # Fetch Java version
          with urllib.request.urlopen(latest['url']) as f:
            version_data = json.load(f)
          
          java_version = version_data.get('javaVersion', {}).get('majorVersion', 8)
          matrix_items.append({
            'javaVersion': java_version,
            'mcVersion': latest['id']
          })
        
        matrix = {'include': matrix_items}
        print('matrix=' + json.dumps(matrix, separators=(',', ':'))) 
        " >> $GITHUB_OUTPUT

  server:
    runs-on: ubuntu-latest
    needs: [test, generate-version-matrix]
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
        java-package: jre
    - name: Install packages
      run: pnpm install --frozen-lockfile
    - name: Test
      run: pnpm run test -t 'MinecraftServer'
      env:
        MC_VERSION: ${{ matrix.mcVersion }}
