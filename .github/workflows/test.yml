name: Test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Install packages
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm run type-check
    - name: Test
      run: pnpm run test --testPathIgnorePatterns 'MinecraftServer'
    - name: Build
      run: pnpm run build

  generate-version-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
    - name: Generate version matrix
      id: generate
      run: |
        python3 -c "
        import json, urllib.request
        from collections import defaultdict
        
        # mineflayer supports to 1.21.3
        version_overrides = {
          '1.21': '1.21.3'
        }
        
        # Fetch manifest
        with urllib.request.urlopen('https://launchermeta.mojang.com/mc/game/version_manifest.json') as f:
          manifest = json.load(f)
        
        # Group releases by major version
        major_versions = defaultdict(list)
        for version in manifest['versions']:
          if version['type'] == 'release':
            major = '.'.join(version['id'].split('.')[:2])
            major_versions[major].append(version)
        
        matrix_items = []
        sorted_majors = sorted(major_versions.keys(), key=lambda v: tuple(map(int, v.split('.'))), reverse=True)
        for major in sorted_majors[:5]:
          if major in version_overrides:
            target_version = version_overrides[major]
            selected_version = None
            for version in manifest['versions']:
              if version['id'] == target_version and version['type'] == 'release':
                selected_version = version
                break
            if not selected_version:
              selected_version = major_versions[major][0]
          else:
            selected_version = major_versions[major][0]

          with urllib.request.urlopen(selected_version['url']) as f:
            version_data = json.load(f)
          
          java_version = version_data.get('javaVersion', {}).get('majorVersion', 8)
          matrix_items.append({
            'javaVersion': java_version,
            'mcVersion': selected_version['id']
          })
        
        matrix = {'include': matrix_items}
        print('matrix=' + json.dumps(matrix, separators=(',', ':'))) 
        " >> $GITHUB_OUTPUT

  server:
    runs-on: ubuntu-latest
    needs: [test, generate-version-matrix]
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
        java-package: jdk
    - name: Install packages
      run: pnpm install --frozen-lockfile
    - name: Test
      run: pnpm run test -t 'MinecraftServer'
      env:
        MC_VERSION: ${{ matrix.mcVersion }}
