name: CI
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Install packages
      run: yarn install --frozen-lockfile
    - name: Type check
      run: yarn type-check
    - name: Test
      run: yarn test --testPathIgnorePatterns 'MinecraftServer'
    - name: Build
      run: yarn build

  generate-version-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
    - uses: oven-sh/setup-bun@v2
    - name: Install mineflayer
      run: bun add mineflayer@latest
    - name: Generate version matrix
      id: generate
      run: |
        bun -e "
        const { testedVersions } = require('mineflayer/lib/version');

        const FALLBACK_JAVA_VERSION = 21;
        
        const compareVersions = (a, b) => {
          const aTuple = a.split('.').map(Number);
          const bTuple = b.split('.').map(Number);
          for (let i = 0; i < Math.max(aTuple.length, bTuple.length); i++) {
            const aVal = aTuple[i] || 0;
            const bVal = bTuple[i] || 0;
            if (aVal < bVal) return -1;
            if (aVal > bVal) return 1;
          }
          return 0;
        };
        
        const versionsToTest = testedVersions.slice(-10);
        
        const manifest = await (await fetch('https://launchermeta.mojang.com/mc/game/version_manifest.json')).json();
        const versionMap = Object.fromEntries(manifest.versions.map(v => [v.id, v]));
        
        const matrixItems = await Promise.all(versionsToTest.map(async (mcVersion) => {
          const versionInfo = versionMap[mcVersion];
          if (!versionInfo) {
            console.error('Version not found in manifest:', mcVersion);
            return { javaVersion: FALLBACK_JAVA_VERSION, mcVersion };
          }
          
          try {
            const versionDetails = await (await fetch(versionInfo.url)).json();
            const javaVersion = versionDetails.javaVersion?.majorVersion ?? FALLBACK_JAVA_VERSION;
            return { javaVersion, mcVersion };
          } catch (err) {
            console.error('Error fetching version data for', mcVersion, ':', err);
            return {
              javaVersion: FALLBACK_JAVA_VERSION,
              mcVersion
            };
          }
        }));
        
        matrixItems.sort((a, b) => -compareVersions(a.mcVersion, b.mcVersion));
        console.log('matrix=' + JSON.stringify({ include: matrixItems }));
        " >> $GITHUB_OUTPUT

  server:
    runs-on: ubuntu-latest
    needs: [generate-version-matrix]
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
        java-package: jdk
    - name: Install packages
      run: yarn install --frozen-lockfile
    - name: Test
      run: yarn test -t 'MinecraftServer'
      env:
        MC_VERSION: ${{ matrix.mcVersion }}
